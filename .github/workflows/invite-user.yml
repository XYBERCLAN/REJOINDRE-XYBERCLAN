name: Invite User to Organization

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  invite:
    runs-on: ubuntu-latest
    if: |
      contains(github.event.issue.labels.*.name, 'join') ||
      startsWith(github.event.issue.title, '[Join Request]')
    steps:
      - name: Invite Issue Author
        uses: actions/github-script@v7
        with:
          github-token: "${{ secrets.ORG_INVITATION_TOKEN }}"
          script: |
            const org = "XYBERCLAN";
            const inviteeId = context.payload.issue.user.id;
            const inviteeLogin = context.payload.issue.user.login;

            try {
              console.log(`Inviting ${inviteeLogin} (id: ${inviteeId}) to ${org}...`);
              await github.rest.orgs.createInvitation({
                org: org,
                invitee_id: inviteeId,
                role: 'direct_member'
              });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `✅ Invitation sent to **@${inviteeLogin}** to join **${org}**! Check your GitHub notifications or email to accept it.`
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed'
              });

            } catch (error) {
              console.error(error);
              let errorMessage = error.message;
              if (error.status === 422) {
                errorMessage = "User is already a member or has a pending invitation.";
              } else if (error.status === 404) {
                errorMessage = "Organization not found — check that ORG_INVITATION_TOKEN has admin:org scope and access to this org.";
              }

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `❌ Failed to send invitation: ${errorMessage}`
              });
            }
